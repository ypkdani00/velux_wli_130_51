; DFRobot FireBeetle 2 ESP32-C6: Zigbee all the time, Wi-Fi (web UI, API,
; OTA) only while the mode switch is ON - see src/Config.h sections 3 and 7.
;
;   .\export_release.ps1 [-Upload [-Port COMx]]   build (+ flash over USB), copy to ..\build
;   pio run                                       build only -> .pio\build\firebeetle2_c6
;
; Light sleep needs ESP-IDF built with power management, which the stock
; Arduino core isn't: pioarduino's "custom_sdkconfig" recompiles the ESP-IDF
; libraries underneath the Arduino core ("hybrid compile"). The first build
; takes 20-30 min; later ones only recompile what changed.
;
; First flash over USB (export_release.ps1 -Upload, or pio run -t upload): it
; also writes the partition table below. Later updates from the web UI or OTA.

[platformio]
default_envs = firebeetle2_c6

[env:firebeetle2_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = dfrobot_firebeetle2_esp32c6
monitor_speed = 115200
; the chip's own USB port: don't hold it in reset / download mode
monitor_dtr = 0
monitor_rts = 0
; Before every build: regenerate WebUI_gz.h, and cope with Windows Smart App
; Control blocking littlefs-python (see the comments in the script).
extra_scripts = pre:tools/pio_prebuild.py

; Wi-Fi + Zigbee + web UI don't fit in the stock 1.25 MB app slots: two
; 1.875 MB slots plus the Zigbee partitions.
board_build.partitions = partitions_c6_zigbee.csv

; Zigbee end device (what the Arduino core calls Tools -> Zigbee mode -> "ED").
build_flags =
    -DZIGBEE_MODE_ED
    -lesp_zb_api.ed
    -lzboss_stack.ed
    -lzboss_port.native

; The Arduino core libraries the sketch includes are listed explicitly: the
; library finder doesn't have to dig them out of a file included by name.
lib_deps =
    WiFi
    WebServer
    ESPmDNS
    ArduinoOTA
    Preferences
    Update
    Zigbee

; Light sleep for both radios: Wi-Fi modem sleep, plus the 802.15.4 (Zigbee)
; radio sleeping between polls of its parent. Bluetooth and Thread are
; unused: off, for a smaller image and a shorter build.
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    CONFIG_IEEE802154_SLEEP_ENABLE=y
    CONFIG_ZB_ENABLED=y
    CONFIG_ZB_ZED=y
    '# CONFIG_BT_ENABLED is not set'
    '# CONFIG_OPENTHREAD_ENABLED is not set'

; The Arduino core asks ESP-IDF for ~20 extra components (RainMaker, Modbus,
; an MP3 decoder...). This sketch uses none of them besides Zigbee: skipping
; them makes the hybrid build much shorter and avoids downloading them.
; Kept: the Zigbee libraries, espressif/mdns (velux.local), joltwallet/littlefs.
custom_component_remove =
    espressif/esp_modem
    espressif/esp-dsp
    espressif/network_provisioning
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/qrcode
    espressif/esp-sr
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/libsodium
    espressif/esp-modbus
    chmorgan/esp-libhelix-mp3
    espressif/lan867x
; ...and the Arduino libraries built on top of them.
lib_ignore =
    RainMaker
    Insights
    ESP_SR
    WiFiProv
    PPP
